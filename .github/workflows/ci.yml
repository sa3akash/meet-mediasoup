name: CI & Container Registry

on:
  push:
    branches: [main, master, develop]
    tags: ['v*']
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read
  packages: write

jobs:
  # =========================================================================
  # 1. Path Filter: Detect changes in Client, Server, or Shared Packages
  # =========================================================================
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      client: ${{ steps.filter.outputs.client }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect Changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - 'apps/server/**'
              - 'packages/**'
              - 'package.json'
              - 'bun.lock*'
              - 'turbo.json'
              - '.github/workflows/ci.yml'
            client:
              - 'apps/client/**'
              - 'packages/**'
              - 'package.json'
              - 'bun.lock*'
              - 'turbo.json'
              - '.github/workflows/ci.yml'

  # =========================================================================
  # 2. Validation: Server
  # =========================================================================
  validate-server:
    name: Validate Server
    needs: changes
    if: needs.changes.outputs.server == 'true' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck Server
        run: bun run --filter server typecheck

      - name: Build Server
        run: bun run --filter server build

  # =========================================================================
  # 3. Validation: Client
  # =========================================================================
  validate-client:
    name: Validate Client
    needs: changes
    if: needs.changes.outputs.client == 'true' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck Client
        run: bun run --filter client typecheck

      - name: Lint Client
        run: bun run --filter client lint

      - name: Build Client
        run: bun run --filter client build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  # =========================================================================
  # 4. Build & Push: Server Image
  # =========================================================================
  build-and-push-server:
    name: Build & Push Server Image
    needs: [changes, validate-server]
    if: github.event_name == 'push' && (needs.changes.outputs.server == 'true' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lower case repository and owner names
        run: |
          echo "OWNER_LOWER=${OWNER,,}" >> $GITHUB_ENV
        env:
          OWNER: '${{ github.repository_owner }}'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Server
        id: meta-server
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.OWNER_LOWER }}/meet-server
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
          labels: |
            org.opencontainers.image.title=Enterprise Meet Server
            org.opencontainers.image.description=Scalable WebRTC Signaling & Media Server (Bun + Mediasoup)
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: Build and push Server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/server/Dockerfile
          push: true
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
  # 5. Build & Push: Client Image
  # =========================================================================
  build-and-push-client:
    name: Build & Push Client Image
    needs: [changes, validate-client]
    if: github.event_name == 'push' && (needs.changes.outputs.client == 'true' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lower case repository and owner names
        run: |
          echo "OWNER_LOWER=${OWNER,,}" >> $GITHUB_ENV
        env:
          OWNER: '${{ github.repository_owner }}'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Client
        id: meta-client
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.OWNER_LOWER }}/meet-client
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
          labels: |
            org.opencontainers.image.title=Enterprise Meet Client
            org.opencontainers.image.description=Next.js 16 WebRTC Video Conferencing Web Client
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: Build and push Client image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/client/Dockerfile
          push: true
          tags: ${{ steps.meta-client.outputs.tags }}
          labels: ${{ steps.meta-client.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
